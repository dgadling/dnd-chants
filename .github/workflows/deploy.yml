name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Install functions deps
        run: |
          cd functions
          npm install --no-audit --no-fund

      - name: Build functions
        run: |
          cd functions
          npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          channelId: live
          projectId: chants-506202

      - name: Deploy Firebase Functions (dndbeyondProxy)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' | base64 -d > /tmp/sa.json 2>/dev/null || echo '${{ secrets.GCP_SA_KEY }}' > /tmp/sa.json
          gcloud auth activate-service-account --key-file=/tmp/sa.json --project=chants-506202 || true
          npx --yes firebase-tools@latest deploy --only functions --project chants-506202 --force
          rm -f /tmp/sa.json
