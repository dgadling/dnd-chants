name: Deploy to Cloud Run

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build image
        run: docker build -t us-central1-docker.pkg.dev/chants-506202/dnd-chants/dnd-chants:${{ github.sha }} -t us-central1-docker.pkg.dev/chants-506202/dnd-chants/dnd-chants:latest .

      - name: Push image
        run: |
          docker push us-central1-docker.pkg.dev/chants-506202/dnd-chants/dnd-chants:${{ github.sha }}
          docker push us-central1-docker.pkg.dev/chants-506202/dnd-chants/dnd-chants:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy dnd-chants \
            --project=chants-506202 \
            --region=us-central1 \
            --image=us-central1-docker.pkg.dev/chants-506202/dnd-chants/dnd-chants:${{ github.sha }} \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=2 \
            --memory=256Mi \
            --cpu=0.25 \
            --concurrency=1 \
            --cpu-throttling \
            --set-env-vars="DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }},NODE_ENV=production" \
            --set-secrets="DISCORD_CLIENT_SECRET=discord_client_secret:latest,DISCORD_CLIENT_ID=discord_client_id:latest,GOOGLE_TRANSLATE_API_KEY=google_translate_api_key:latest" \
            --quiet
