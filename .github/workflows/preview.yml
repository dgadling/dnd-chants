name: Preview Channel

on:
  push:
    branches: [feat/*]
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Derive channel id
        id: chan
        run: |
          BR="${GITHUB_REF_NAME}"
          CH=$(echo "$BR" | tr '/_' '-' | tr -cd 'a-zA-Z0-9-' | tr '[:upper:]' '[:lower:]' | cut -c1-30)
          echo "channel=$CH" >> $GITHUB_OUTPUT
          echo "Channel $CH from $BR"

      - name: Cache bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lockb', 'package.json') }}
          restore-keys: |
            bun-

      - name: Cache Next.js
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('bun.lockb', 'package.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**') }}
          restore-keys: |
            nextjs-${{ hashFiles('bun.lockb', 'package.json') }}-
            nextjs-

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        env:
          NEXT_PUBLIC_DISCORD_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_DISCORD_CLIENT_ID }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: bun run build

      - name: Deploy preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          channelId: ${{ steps.chan.outputs.channel }}
          projectId: chants-506202
          expires: 7d
